name: KONNTO safe quality checks

on:
  push:
    branches:
      - konnto-v2-foundation
      - kbrain-workflow-v1
      - phase0-reliability-audit
  pull_request:
    branches:
      - main
      - konnto-v2-foundation

permissions:
  contents: read

jobs:
  python-static-and-policy-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test runner
        run: python -m pip install pytest==9.2.0 pytest-xdist==3.8.0
      - name: Compile backend Python source
        run: python -m compileall -q backend
      - name: Run K-BRAIN workflow tests
        working-directory: backend
        run: python -m pytest -q test_kbrain_workflow.py test_pcm_sync_policy.py test_pcm_sync.py test_kbrain_diagnostics.py
      - name: Run isolated backend unit tests
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/unit
